
{% extends "Base.html" %}
{% block content %}

    <form method="post" class="form-control p-4 w-50 mx-auto mt-5 bg-light">
        {% csrf_token %}
        <label for="number1" class="">Val 1:</label>
        <input class="form-control" type="number" name="num1" required>
        <br>
        <label for="number2">Val 2:</label>
        <input class="form-control" type="number" name="num2" required>
        <br>
        <br>
        <label for="operation">Operation:</label>
        <select id="operation" name="operation" required>
            <option value="add">Add</option>
            <option value="subtract">Subtract</option>
            <option value="multiply">Multiply</option>
            <option value="divide">Divide</option>
        </select>
        <br>
        <br>
        <button class="btn bg-warning" type="submit">Calculate</button>
        <br>
        <label for="number2">Output:</label>
        
        <input class="form-control" type="number" name="result" value="{{ result }}" readonly>
       
    </form>
{% endblock %}
